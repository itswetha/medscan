# Same job the Vite dev proxy does, for the production build.
# Browsers navigating to a page send "Accept: text/html"; API calls do not.
map $http_accept $wants_html {
    default 0;
    "~*text/html" 1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 12m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Paths that are only ever the API
    location ~ ^/(auth|scans|patients|notifications|health)(/|$) {
        proxy_pass http://backend:8000;
    }

    # /doctor/reviews is the API; /doctor/review/<id> and /doctor/profile are pages
    location ~ ^/doctor/reviews(/|$) {
        proxy_pass http://backend:8000;
    }

    # Paths used by both a page and the API: page loads get the app,
    # API calls go to the backend
    location ~ ^/(doctors|admin/monitoring|admin/audit-logs)(/|$) {
        if ($wants_html) {
            rewrite ^ /index.html last;
        }
        proxy_pass http://backend:8000;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Everything else is the React app
    location / {
        try_files $uri /index.html;
    }
}
